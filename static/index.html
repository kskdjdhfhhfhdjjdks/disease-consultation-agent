<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>疾病问诊助手</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --success: #16a34a;
    --success-bg: #f0fdf4;
    --warning: #d97706;
    --warning-bg: #fffbeb;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--primary), #7c3aed);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px;
  }
  .brand h1 { font-size: 17px; font-weight: 700; }
  .brand p { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .header-actions { display: flex; align-items: center; gap: 10px; }
  .status-dot { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .status-dot i { width: 8px; height: 8px; border-radius: 50%; background: var(--success); display: inline-block; }
  .btn {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 14px; cursor: pointer; font-size: 13px; color: var(--muted);
    transition: all .15s;
  }
  .btn:hover { color: var(--text); border-color: #9ca3af; }

  #chat { flex: 1; overflow-y: auto; padding: 22px 20px 10px; width: 100%; max-width: 840px; margin: 0 auto; }
  .msg { display: flex; margin-bottom: 18px; }
  .msg.user { justify-content: flex-end; }
  .msg.assistant { justify-content: flex-start; }
  .bubble {
    max-width: 82%; padding: 12px 16px; border-radius: var(--radius);
    line-height: 1.65; font-size: 15px; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble {
    background: var(--card); border: 1px solid var(--border);
    border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }

  /* 报告卡片 */
  .report { min-width: 0; }
  .report .head {
    display: flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 15px; margin-bottom: 12px;
  }
  .report .head .badge {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
    background: #eef2ff; color: var(--primary);
  }
  .sec { margin-bottom: 14px; }
  .sec .label {
    font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .3px; margin-bottom: 6px;
  }
  .cand { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 6px; }
  .cand .rank { width: 22px; height: 22px; border-radius: 50%; background: #eef2ff; color: var(--primary); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .cand .name { font-weight: 600; }
  .cand .meta { font-size: 12px; color: var(--muted); margin-left: auto; white-space: nowrap; }
  .tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
  .tag.high { background: var(--success-bg); color: var(--success); }
  .tag.mid { background: var(--warning-bg); color: var(--warning); }
  .tag.low { background: #f3f4f6; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; padding: 5px 11px; border-radius: 20px; background: #f3f4f6; border: 1px solid var(--border); }
  .chip.department { background: #eef2ff; border-color: #dbeafe; color: var(--primary-dark); }
  .drug { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 3px 0; }
  .drug .line { font-size: 11px; color: var(--primary); background: #eef2ff; padding: 1px 7px; border-radius: 5px; }
  .explain { font-size: 14px; color: #374151; background: #f9fafb; border-radius: 10px; padding: 10px 12px; border: 1px solid var(--border); }
  .diff-item { font-size: 14px; padding: 3px 0; }
  .diff-item .dir { color: var(--muted); font-size: 13px; }
  .warning {
    background: var(--danger-bg); border: 1px solid #fecaca; color: #991b1b;
    border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 10px;
  }
  .disclaimer { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .symptom-hint { font-size: 12px; color: var(--muted); margin-top: 8px; }

  footer {
    flex-shrink: 0; background: var(--card); border-top: 1px solid var(--border);
    padding: 12px 20px 14px;
  }
  .inputbar { display: flex; gap: 10px; max-width: 840px; margin: 0 auto; }
  .inputbar input {
    flex: 1; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px;
    font-size: 15px; outline: none; transition: border-color .15s;
  }
  .inputbar input:focus { border-color: var(--primary); }
  .inputbar button {
    padding: 0 22px; border: none; border-radius: 10px; background: var(--primary);
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s;
  }
  .inputbar button:hover { background: var(--primary-dark); }
  .inputbar button:disabled { background: #9ca3af; cursor: not-allowed; }
  .foot-note { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; max-width: 840px; margin-left: auto; margin-right: auto; }

  .typing { display: inline-flex; gap: 4px; padding: 6px 0; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: #9ca3af; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">＋</div>
      <div>
        <h1>疾病问诊助手</h1>
        <p>知识图谱 + 向量检索 · 辅助诊断（不替代医生）</p>
      </div>
    </div>
    <div class="header-actions">
      <span class="status-dot"><i></i>服务正常</span>
      <button class="btn" id="resetBtn">重新开始</button>
    </div>
  </header>

  <div id="chat"></div>

  <footer>
    <div class="inputbar">
      <input id="input" type="text" placeholder="描述你的症状，例如：发热3天，咳，有痰，胸痛" autocomplete="off">
      <button id="send">发送</button>
    </div>
    <div class="foot-note">⚠️ 本系统仅供辅助参考，不能替代执业医师的诊断，如有不适请及时就医。</div>
  </footer>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const resetBtn = document.getElementById('resetBtn');

// 会话状态由前端维护，随每次请求回传后端（无状态后端）
let session = { symptoms: [], rounds: 0, asked: [] };

// ===== 部署配置 =====
// 部署到 Netlify 后，这里指向你的后端地址（Vercel）。
// 本地开发时改回 ''（同域，uvicorn 直连本地）。
const API_BASE = 'https://disease-consultation-agent.vercel.app';

function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

function addUserMsg(text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg user';
  wrap.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
  chatEl.appendChild(wrap);
  scrollBottom();
}

function addAssistantText(text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  wrap.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
  chatEl.appendChild(wrap);
  scrollBottom();
}

function addTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  wrap.id = 'typing-msg';
  wrap.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chatEl.appendChild(wrap);
  scrollBottom();
  return wrap;
}

function removeTyping(wrap) { if (wrap) wrap.remove(); }

function addReport(report) {
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  const b = document.createElement('div');
  b.className = 'bubble report';

  let html = `<div class="head">📋 诊断报告 <span class="badge">基于知识图谱</span></div>`;

  // 候选疾病
  html += `<div class="sec"><div class="label">候选疾病</div>`;
  (report.candidates || []).forEach((c, i) => {
    html += `<div class="cand">
      <span class="rank">${i + 1}</span>
      <span class="name">${escapeHtml(c.disease)}</span>
      <span class="meta">匹配 ${c.matched_count}/${c.total} · 分数 ${c.score}</span>
      <span class="tag ${confClass(c.confidence)}">${escapeHtml(c.confidence)}</span>
    </div>`;
  });
  html += `</div>`;

  // 检查 / 科室
  if ((report.exams || []).length || (report.departments || []).length) {
    html += `<div class="sec"><div class="label">建议检查 / 推荐科室</div><div class="chips">`;
    (report.exams || []).forEach(e => html += `<span class="chip">🔬 ${escapeHtml(e)}</span>`);
    (report.departments || []).forEach(d => html += `<span class="chip department">🏥 ${escapeHtml(d)}</span>`);
    html += `</div></div>`;
  }

  // 用药
  if ((report.drugs || []).length) {
    html += `<div class="sec"><div class="label">常见用药（仅供参考，剂量遵医嘱）</div>`;
    (report.drugs || []).forEach(d => {
      html += `<div class="drug">💊 ${escapeHtml(d.name)} <span class="line">${escapeHtml(d.line || '—')}</span></div>`;
    });
    html += `</div>`;
  }

  // 解释依据
  if (report.explanation) {
    html += `<div class="sec"><div class="label">解释依据</div><div class="explain">${escapeHtml(report.explanation)}</div>`;
    if (report.description) html += `<div class="explain" style="margin-top:6px">${escapeHtml(report.top_disease)}：${escapeHtml(report.description)}</div>`;
    html += `</div>`;
  }

  // 鉴别方向
  if ((report.differentials || []).length) {
    html += `<div class="sec"><div class="label">鉴别方向</div>`;
    (report.differentials || []).forEach(x => {
      html += `<div class="diff-item">· 需与 <b>${escapeHtml(x.name)}</b> 鉴别${x.direction ? `<span class="dir">（${escapeHtml(x.direction)}）</span>` : ''}</div>`;
    });
    html += `</div>`;
  }

  // 红旗警示
  if ((report.red_flags || []).length) {
    html += `<div class="warning">🚨 存在需警惕的症状：${report.red_flags.map(escapeHtml).join('、')}。建议尽快就医，由医生进一步评估。</div>`;
  }

  html += `<div class="disclaimer">⚠️ ${escapeHtml(report.disclaimer || '')}</div>`;
  b.innerHTML = html;
  wrap.appendChild(b);
  chatEl.appendChild(wrap);
  scrollBottom();
}

function addAssistantWithSymptoms(text, symptoms) {
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  let html = `<div class="bubble">${escapeHtml(text)}`;
  if (symptoms && symptoms.length) {
    html += `<div class="symptom-hint">已识别症状：${symptoms.map(escapeHtml).join('、')}</div>`;
  }
  html += `</div>`;
  wrap.innerHTML = html;
  chatEl.appendChild(wrap);
  scrollBottom();
}

function confClass(c) { return c === '高' ? 'high' : (c === '中' ? 'mid' : 'low'); }
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  addUserMsg(text);
  sendBtn.disabled = true;
  const typing = addTyping();

  try {
    const resp = await fetch(API_BASE + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session: session })
    });
    const data = await resp.json();
    session = data.session || session;
    removeTyping(typing);

    if (data.status === 'done' && data.report) {
      addReport(data.report);
    } else {
      addAssistantWithSymptoms(data.reply, data.symptoms);
    }
  } catch (err) {
    removeTyping(typing);
    addAssistantText('⚠️ 请求失败：' + err.message);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

function reset() {
  session = { symptoms: [], rounds: 0, asked: [] };
  chatEl.innerHTML = '';
  addAssistantText('你好，我是疾病问诊助手。请描述你的症状，我会给出候选疾病、建议检查和就诊建议。');
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
resetBtn.addEventListener('click', reset);

reset();
</script>
</body>
</html>
